[project]
name = "gwas-analyst"
version = "0.1.0"
description = "Storage-efficient GWAS permutation pipeline with an agentic analyst layer"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=16.0",
    "polars>=1.0",
    "duckdb>=1.0",
    "anthropic>=0.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
